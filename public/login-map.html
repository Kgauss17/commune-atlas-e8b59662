<!DOCTYPE html>
<html lang="ar">
<head
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>PDTI – Province de Figuig</title>
  <style>
    :root{
      --gold:#f5c84c;--red:#ff3b30;--green:#2fd6a3;
      --hero-base:#B08A2E;--hero-variant:#9A7A24;--hero-deep:#6B4B1A;
      --label-text:#1b1408;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}

    .split{display:block;width:100vw;height:100vh;}


    /* RIGHT */
    .intro-right{background:#000;position:relative;overflow:hidden;width:100%;height:100%;}
    canvas#scene{position:absolute;inset:0;width:100%;height:100%;display:block;}

    /* HUD overlay */
    #hud{
      position:absolute;top:14px;left:14px;
      display:flex;flex-direction:column;gap:6px;
      pointer-events:none;z-index:10;
    }
    .hud-pill{
      display:inline-flex;align-items:center;gap:7px;
      background:rgba(3,7,18,0.72);border:1px solid rgba(245,200,76,0.3);
      border-radius:999px;padding:5px 12px;
      font-size:10px;color:rgba(245,200,76,0.85);letter-spacing:0.12em;
      backdrop-filter:blur(6px);
    }
    .hud-dot{width:6px;height:6px;border-radius:50%;background:#2fd6a3;
      box-shadow:0 0 6px #2fd6a3;animation:pulse 2s infinite;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

    /* Commune tooltip canvas */
    #commune-tooltip{
      position:absolute;pointer-events:none;z-index:20;
      background:rgba(3,7,18,0.94);border:1px solid rgba(245,200,76,0.5);
      border-radius:10px;padding:10px 14px;min-width:180px;
      display:none;backdrop-filter:blur(8px);
    }
    .ct-name{font-size:15px;font-weight:700;color:#f5c84c;margin-bottom:6px;direction:rtl;}
    .ct-namefr{font-size:10px;color:#888;margin-bottom:8px;letter-spacing:0.08em;}
    .ct-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}
    /* BG color picker */
    #bg-picker{
      position:absolute;bottom:16px;left:16px;z-index:30;
      display:flex;align-items:center;gap:8px;
      background:rgba(3,7,18,0.72);border:1px solid rgba(245,200,76,0.3);
      border-radius:999px;padding:6px 14px;
      backdrop-filter:blur(6px);pointer-events:auto;
    }
    #bg-picker span{font-size:9px;color:rgba(245,200,76,0.7);letter-spacing:0.12em;text-transform:uppercase;}
    .bg-swatch{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;
      transition:transform 150ms,border-color 150ms;flex-shrink:0;}
    .bg-swatch:hover{transform:scale(1.2);}
    .bg-swatch.active{border-color:#f5c84c;}
    .ct-stat{background:rgba(245,200,76,0.08);border-radius:6px;padding:5px 8px;text-align:center;}
    .ct-stat .ctn{font-size:14px;font-weight:700;color:#f5c84c;}
    .ct-stat .ctl{font-size:8px;color:#666;text-transform:uppercase;letter-spacing:0.1em;margin-top:1px;}

    /* Phase label */
    #phase-label{
      position:absolute;bottom:16px;right:16px;
      font-size:9px;letter-spacing:0.2em;text-transform:uppercase;
      color:rgba(245,200,76,0.35);pointer-events:none;z-index:10;
    }

    @media(max-width:980px){
      .split{grid-template-columns:1fr;}

    }
  </style>
</head>

// ─── CANVAS SETUP ─────────────────────────────────────────────────────────────
const canvas    = document.getElementById("scene");
const ctx       = canvas.getContext("2d");
const mapPanel  = document.querySelector(".intro-right");
const tooltip   = document.getElementById("commune-tooltip");
const phaseLabel= document.getElementById("phase-label");

let W = mapPanel.clientWidth  || 800;
let H = mapPanel.clientHeight || 600;

// ─── PROJECTION SVG ───────────────────────────────────────────────────────────
let projectedPolygons = [];  // [{pts:[{x,y}], nameAr, nameFr, pop}]
let projectedNodes    = [];  // [{x,y,nameAr,nameFr,pop}]
let projectedEdges    = [];  // [[i,j]]
let hoveredIdx        = null;
let bbox              = null;

function computeBbox(){
  bbox = null;
  GEOJSON.features.forEach(function(f){
    const coords = f.geometry.type==='Polygon'
      ? f.geometry.coordinates[0]
      : f.geometry.coordinates[0][0];
    coords.forEach(function(c){
      if(!bbox){ bbox={minx:c[0],maxx:c[0],miny:c[1],maxy:c[1]}; }
      else{
        bbox.minx=Math.min(bbox.minx,c[0]); bbox.maxx=Math.max(bbox.maxx,c[0]);
        bbox.miny=Math.min(bbox.miny,c[1]); bbox.maxy=Math.max(bbox.maxy,c[1]);
      }
    });
  });
}

function project(lon,lat,scale,offX,offY){
  return { x: lon*scale+offX, y: -lat*scale+offY };
}

function buildProjection(){
  if(!bbox) return;
  const PAD = 40;
  const gW  = bbox.maxx-bbox.minx;
  const gH  = bbox.maxy-bbox.miny;
  const scale = Math.min((W-PAD*2)/gW, (H-PAD*2)/gH);
  const dW    = gW*scale, dH = gH*scale;
  const offX  = (W-dW)/2 - bbox.minx*scale;
  const offY  = (H-dH)/2 + bbox.maxy*scale;

  projectedPolygons = [];
  projectedNodes    = [];

  GEOJSON.features.forEach(function(f){
    const nameAr = f.properties['name:ar'];
    const nameFr = f.properties['name:fr']||'';
    const pop    = parseInt(f.properties.population||0)||0;
    const coords = f.geometry.type==='Polygon'
      ? f.geometry.coordinates[0]
      : f.geometry.coordinates[0][0];
    const pts = coords.map(function(c){ return project(c[0],c[1],scale,offX,offY); });
    projectedPolygons.push({pts,nameAr,nameFr,pop});

    // centroïde
    let cx=0,cy=0;
    pts.forEach(function(p){cx+=p.x;cy+=p.y;});
    projectedNodes.push({x:cx/pts.length, y:cy/pts.length, nameAr,nameFr,pop});
  });

  // edges (3 plus proches voisins)
  projectedEdges = [];
  const used = new Set();
  projectedNodes.forEach(function(a,i){
    const dists = projectedNodes.map(function(b,j){
      if(i===j)return{j,d:Infinity};
      const dx=a.x-b.x,dy=a.y-b.y;
      return{j,d:dx*dx+dy*dy};
    }).sort(function(p,q){return p.d-q.d;});
    dists.slice(0,3).forEach(function(entry){
      const key = i<entry.j?i+'-'+entry.j:entry.j+'-'+i;
      if(!used.has(key)){ used.add(key); projectedEdges.push([i,entry.j]); }
    });
  });
}

computeBbox();

function resize(){
  const r = mapPanel.getBoundingClientRect();
  W = Math.max(1,Math.floor(r.width));
  H = Math.max(1,Math.floor(r.height));
  canvas.width=W; canvas.height=H;
  buildProjection();
}
window.addEventListener('resize',resize);
resize();

canvas.addEventListener('mousemove',function(e){
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  let best=null,bestD=Infinity;
  projectedNodes.forEach(function(n,i){
    const dx=mx-n.x,dy=my-n.y,d=dx*dx+dy*dy;
    if(d<bestD){bestD=d;best=i;}
  });
  hoveredIdx=(bestD<50*50)?best:null;

  if(hoveredIdx!==null){
    const n=projectedNodes[hoveredIdx];
    const st=BV_STATS[n.nameAr]||{bv:'—',circs:'—'};
    document.getElementById('ct-name').textContent=n.nameAr;
    document.getElementById('ct-namefr').textContent=n.nameFr;
    document.getElementById('ct-pop').textContent=(n.pop||0).toLocaleString();
    document.getElementById('ct-bv').textContent=st.bv;
    document.getElementById('ct-circs').textContent=st.circs||'—';
    const tx=Math.min(e.clientX-r.left+16, W-200);
    const ty=Math.max(e.clientY-r.top-80, 10);
    tooltip.style.left=tx+'px';
    tooltip.style.top=ty+'px';
    tooltip.style.display='block';
  } else {
    tooltip.style.display='none';
  }
});
canvas.addEventListener('mouseleave',function(){
  hoveredIdx=null; tooltip.style.display='none';
});

// ─── RENDU FIGUIG ────────────────────────────────────────────────────────────
function renderFiguig(t, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;

  // Grille de fond
  ctx.save();
  ctx.globalAlpha=alpha*0.06;
  ctx.strokeStyle='#1a2136'; ctx.lineWidth=1;
  const gs=Math.round(Math.max(W,H)/14);
  for(let x=0;x<=W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.restore();

  // Polygones communes
  projectedPolygons.forEach(function(poly,idx){
    const isHov=(idx===hoveredIdx);
    const st=BV_STATS[poly.nameAr]||{bv:0};
    // couleur selon nb BV
    const bv=st.bv||0;
    const fillColor = bv>=5?'rgba(233,69,96,0.22)':
                      bv>=3?'rgba(230,126,34,0.18)':
                      bv>=2?'rgba(243,156,18,0.15)':
                            'rgba(39,174,96,0.12)';
    ctx.beginPath();
    poly.pts.forEach(function(p,i){ i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); });
    ctx.closePath();
    ctx.fillStyle=fillColor;
    ctx.globalAlpha=alpha*(isHov?0.95:0.75);
    ctx.fill();

    // Bordure aura
    const glowLayers=isHov?[{w:14,a:0.12},{w:6,a:0.6}]:[{w:8,a:0.05},{w:2,a:0.55}];
    glowLayers.forEach(function(l){
      ctx.beginPath();
      poly.pts.forEach(function(p,i){ i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); });
      ctx.closePath();
      ctx.strokeStyle='rgba(255,214,107,'+l.a+')';
      ctx.lineWidth=l.w; ctx.globalAlpha=alpha;
      ctx.stroke();
    });
  });

  // Réseau edges
  ctx.save();
  ctx.globalAlpha=alpha*0.35;
  ctx.strokeStyle='rgba(255,214,107,0.5)';
  ctx.lineWidth=1;
  projectedEdges.forEach(function(e){
    const a=projectedNodes[e[0]],b=projectedNodes[e[1]];
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  });
  ctx.restore();

  // Nœuds + labels
  projectedNodes.forEach(function(n,idx){
    const isHov=(idx===hoveredIdx);
    const pulse=1+0.35*Math.sin(t*1.8+idx*0.7);
    const base=isHov?10:7;
    const r=base*pulse;

    // Halo
    const grad=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*3);
    grad.addColorStop(0,'rgba(255,214,107,0.55)');
    grad.addColorStop(1,'rgba(255,214,107,0)');
    ctx.globalAlpha=alpha*0.9;
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.arc(n.x,n.y,r*3,0,Math.PI*2); ctx.fill();

    // Point central
    ctx.globalAlpha=alpha;
    ctx.fillStyle=isHov?'#ffffff':GOLD;
    ctx.beginPath(); ctx.arc(n.x,n.y,r,0,Math.PI*2); ctx.fill();

    // Orbit ring si survolé
    if(isHov){
      ctx.globalAlpha=alpha*0.5;
      ctx.strokeStyle='rgba(255,255,255,0.5)';
      ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(n.x,n.y,r*2.2,0,Math.PI*2); ctx.stroke();
    }

    // Label
    const label=n.nameAr;
    const fs=W<600?9:11;
    ctx.font='bold '+fs+'px system-ui,Arial';
    const tw=ctx.measureText(label).width;
    const bx=n.x-tw/2-5, by=n.y-r-18, bw=tw+10, bh=fs+8;

    ctx.globalAlpha=alpha*0.85;
    ctx.fillStyle='rgba(3,7,18,0.72)';
    ctx.strokeStyle='rgba(245,200,76,0.45)';
    ctx.lineWidth=1;
    roundRect(bx,by,bw,bh,6);
    ctx.fill(); ctx.stroke();

    ctx.globalAlpha=alpha;
    ctx.fillStyle=isHov?'#ffffff':'#d8b15a';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(label, n.x, by+bh/2);

    // Sous-label : nb BV
    const st=BV_STATS[n.nameAr]||{bv:'—'};
    const sublabel=st.bv+' BV';
    ctx.font=(fs-2)+'px system-ui,Arial';
    ctx.fillStyle='rgba(255,214,107,0.6)';
    ctx.fillText(sublabel, n.x, n.y+r+10);
  });

  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ─── BOUCLE PRINCIPALE ───────────────────────────────────────────────────────
function draw(ts){
  const t=ts*0.001;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=currentBg; ctx.fillRect(0,0,W,H);

  // Étoiles
  ctx.save();
  STARS.forEach(function(s){
    const a=s.a+0.35*Math.abs(Math.sin(t*s.tw+s.ph));
    ctx.globalAlpha=a;
    ctx.fillStyle=GOLD;
    ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.s,0,Math.PI*2); ctx.fill();
  });
  ctx.restore();

  // Transition
  let transAlpha=0;
  if(nextPhase){
    transAlpha=Math.min((ts-phaseStart)/TRANS_DUR,1);
    if(transAlpha>=1){scenePhase=nextPhase;nextPhase=null;phaseStart=ts;}
  }

  if(nextPhase){
    renderFiguig(t,1-transAlpha);
    renderFiguig(t,transAlpha);
  } else {
    renderFiguig(t,1);
  }

  // Phase label
  if(phaseLabel) phaseLabel.textContent='إقليم فجيج — CARTE ÉLECTORALE';

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);

// ─── COULEUR ARRIERE-PLAN ─────────────────────────────────────────────────────
var currentBg = '#000000';
document.querySelectorAll('.bg-swatch').forEach(function(sw){
  sw.addEventListener('click', function(){
    currentBg = sw.getAttribute('data-color');
    document.querySelectorAll('.bg-swatch').forEach(function(s){ s.classList.remove('active'); });
    sw.classList.add('active');
  });
});

    Object.assign(BV_STATS,data);
  }catch(e){ console.error('updateBVStats:',e); }
}
